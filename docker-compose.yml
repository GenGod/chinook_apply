services:
  postgres:
    image: postgres:17-alpine
    container_name: chinook-postgres
    environment:
      POSTGRES_USER: chinook
      POSTGRES_PASSWORD: chinook_dev
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinook -d chinook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
