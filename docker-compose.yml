services:
  postgres:
    image: postgres:17-alpine
    container_name: chinook-postgres
    environment:
      POSTGRES_USER: chinook
      POSTGRES_PASSWORD: chinook_dev
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinook -d chinook"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: chinook-scheduler
    init: true # tini PID1: SIGTERM reaches the node process
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # service-name network, NOT localhost
      DATABASE_URL: postgres://chinook:chinook_dev@postgres:5432/chinook
      # secrets come from the host .env at compose time; never baked into the image
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      # optional schedule overrides
      SCHED_JOBBANK_MIN: ${SCHED_JOBBANK_MIN:-30}
      SCHED_ADZUNA_MIN: ${SCHED_ADZUNA_MIN:-120}

volumes:
  pgdata:
