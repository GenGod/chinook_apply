services:
  postgres:
    image: postgres:17-alpine
    container_name: chinook-postgres
    environment:
      POSTGRES_USER: chinook
      POSTGRES_PASSWORD: chinook_dev
      POSTGRES_DB: chinook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chinook -d chinook"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: chinook-scheduler
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chinook:chinook_dev@postgres:5432/chinook
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      CRAWLER_CONTACT_EMAIL: ${CRAWLER_CONTACT_EMAIL:-}
      SCHED_JOBBANK_MIN: ${SCHED_JOBBANK_MIN:-30}
      SCHED_ADZUNA_MIN: ${SCHED_ADZUNA_MIN:-120}

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: chinook-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: chinook-web
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # master_profile.json is gitignored PII — mounted read-only at the static
      # path the generation service resolves from WORKDIR /app/apps/web
      # (../../data/profile → /app/data/profile)
      - ./data/profile:/app/data/profile:ro
      # S6: rendered DOCX/PDF artifacts (gitignored PII) — writable, same
      # repo-layout convention (../../data/artifacts → /app/data/artifacts)
      - ./data/artifacts:/app/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://chinook:chinook_dev@postgres:5432/chinook
      CRAWLER_CONTACT_EMAIL: ${CRAWLER_CONTACT_EMAIL:-}
      # S8 dispatch (dry-run default: envelope goes to dispatch-sink@localhost)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DISPATCH_MODE: ${DISPATCH_MODE:-dry-run}
      DISPATCH_DAILY_LIMIT: ${DISPATCH_DAILY_LIMIT:-10}

volumes:
  pgdata:
