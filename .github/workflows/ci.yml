name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chinook
          POSTGRES_PASSWORD: chinook_dev
          POSTGRES_DB: chinook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chinook -d chinook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      # ubuntu-latest no longer ships git-lfs; snapshots live in LFS,
      # so install it BEFORE checkout can pull them.
      - name: Install git-lfs
        run: sudo apt-get update -q && sudo apt-get install -y -q git-lfs

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pipeline (lint → arch-lint → typecheck → test → build → e2e)
        env:
          DATABASE_URL: postgres://chinook:chinook_dev@localhost:5432/chinook
        run: pnpm pipeline:check

      - name: Integration tests (fixtures → postgres service)
        env:
          DATABASE_URL: postgres://chinook:chinook_dev@localhost:5432/chinook
        run: pnpm --filter @chinook/tests exec vitest run --config vitest.integration.config.ts

      - name: Docker build gate (scheduler image, S15)
        run: docker build -f apps/worker/Dockerfile -t chinook-scheduler:${{ github.sha }} .

      - name: Upload test artifacts (diffs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore
