name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      # ubuntu-latest no longer ships git-lfs; snapshots live in LFS,
      # so install it BEFORE checkout can pull them.
      - name: Install git-lfs
        run: sudo apt-get update -q && sudo apt-get install -y -q git-lfs

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pipeline (lint → arch-lint → typecheck → test → build → e2e)
        run: pnpm pipeline:check

      - name: Upload test artifacts (diffs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
